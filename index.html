
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Quiz</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .quiz-container {
            background: white;
            width: 100%;
            max-width: 500px;
            padding: 30px 24px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1, h2 {
            text-align: center;
        }

        p {
            line-height: 1.5;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .answer-button {
            background: #f1f5f9;
            color: #222;
            border: 1px solid #ddd;
            text-align: left;
            margin-top: 10px;
        }

        .answer-button:hover {
            background: #e2e8f0;
        }

        .answer-button.selected {
            background: #dbeafe;
            border: 2px solid #2563eb;
        }

        textarea {
            width: 100%;
            min-height: 120px;
            padding: 12px;
            margin-top: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-family: Arial, sans-serif;
            font-size: 16px;
            resize: vertical;
        }

        .progress {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .hidden {
            display: none;
        }

        #status {
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="quiz-container">

    <!-- START SCREEN -->
    <div id="start-screen">
        <h1>Welcome to the Quiz!</h1>
        <p>Answer the following questions to complete the quiz.</p>
        <button onclick="startQuiz()">Start Quiz</button>
    </div>

    <!-- QUIZ SCREEN -->
    <div id="quiz-screen" class="hidden">
        <div class="progress" id="progress"></div>
        <h2 id="question"></h2>
        <div id="answers"></div>
        <button id="next-button" onclick="nextQuestion()">Next</button>
        <p id="status"></p>
    </div>

    <!-- FINISH SCREEN -->
    <div id="finish-screen" class="hidden">
        <h1>Thank you!</h1>
        <p>Your answer has been submitted successfully.</p>
        <button onclick="restartQuiz()">Restart Quiz</button>
    </div>

</div>

<script>

    // QUIZ QUESTIONS

    const questions = [
        {
            type: "multiple",
            question: "What is your favorite color?",
            answers: ["Red", "Blue", "Green", "Yellow"]
        },
        {
            type: "multiple",
            question: "Which season do you prefer?",
            answers: ["Spring", "Summer", "Autumn", "Winter"]
        },
        {
            type: "multiple",
            question: "What is your favorite food?",
            answers: ["Pizza", "Burger", "Pasta", "Sushi"]
        },
        {
            type: "multiple",
            question: "Which animal do you like most?",
            answers: ["Dog", "Cat", "Horse", "Dolphin"]
        },
        {
            type: "text",
            question: "Is there anything else you would like to tell us?"
        },
        {
            type: "multiple",
            question: "How would you describe yourself?",
            answers: ["Adventurous", "Creative", "Calm", "Ambitious"]
        }
    ];

    // QUIZ VARIABLES

    let currentQuestion = 0;
    let selectedAnswer = null;
    let textAnswer = "";

    function startQuiz() {
        currentQuestion = 0;
        textAnswer = "";

        document.getElementById("start-screen").classList.add("hidden");
        document.getElementById("finish-screen").classList.add("hidden");
        document.getElementById("quiz-screen").classList.remove("hidden");

        showQuestion();
    }

    function showQuestion() {
        const q = questions[currentQuestion];

        selectedAnswer = null;

        document.getElementById("progress").textContent =
            `Question ${currentQuestion + 1} of ${questions.length}`;

        document.getElementById("question").textContent = q.question;

        const answersDiv = document.getElementById("answers");
        answersDiv.innerHTML = "";

        if (q.type === "multiple") {

            q.answers.forEach(answer => {
                const button = document.createElement("button");

                button.textContent = answer;
                button.className = "answer-button";

                button.onclick = () => {
                    selectedAnswer = answer;

                    document.querySelectorAll(".answer-button")
                        .forEach(btn => btn.classList.remove("selected"));

                    button.classList.add("selected");
                };

                answersDiv.appendChild(button);
            });

        } else {

            const textarea = document.createElement("textarea");

            textarea.placeholder = "Type your answer here...";
            textarea.value = textAnswer;

            textarea.oninput = () => {
                textAnswer = textarea.value;
            };

            answersDiv.appendChild(textarea);
        }

        document.getElementById("next-button").textContent =
            currentQuestion === questions.length - 1
                ? "Finish Quiz"
                : "Next";

        document.getElementById("status").textContent = "";
    }

    async function nextQuestion() {
        const q = questions[currentQuestion];

        if (q.type === "multiple" && selectedAnswer === null) {
            alert("Please select an answer.");
            return;
        }

        if (q.type === "text") {
            const textarea = document.querySelector("textarea");
            textAnswer = textarea.value.trim();

            if (!textAnswer) {
                alert("Please enter your answer.");
                return;
            }
        }

        currentQuestion++;

        if (currentQuestion < questions.length) {
            showQuestion();
        } else {
            await submitAnswer();
        }
    }

    // SEND TEXT ANSWER THROUGH FORMSUBMIT

    async function submitAnswer() {
        const nextButton = document.getElementById("next-button");
        const status = document.getElementById("status");

        nextButton.disabled = true;
        nextButton.textContent = "Sending...";
        status.textContent = "Submitting your answer...";

        const formData = new FormData();

        formData.append("message", textAnswer);
        formData.append("_subject", "New Quiz Submission");
        formData.append("_captcha", "false");
        formData.append("_template", "table");

        try {
            const response = await fetch(
    "https://formsubmit.co/ajax/peba7a@gmail.com",
    {
        method: "POST",
        body: formData,
        headers: {
            "Accept": "application/json"
        }
    }
);

const result = await response.json();

if (result.success !== true && result.success !== "true") {
    throw new Error(result.message || "Submission failed");
}

            document.getElementById("quiz-screen").classList.add("hidden");
            document.getElementById("finish-screen").classList.remove("hidden");

        } catch (error) {
    console.error("Submission error:", error);

    status.textContent = "Error: " + error.message;

    nextButton.disabled = false;
    nextButton.textContent = "Try Again";
}
    }

    function restartQuiz() {
        textAnswer = "";
        startQuiz();
    }

</script>

</body>
</html>
